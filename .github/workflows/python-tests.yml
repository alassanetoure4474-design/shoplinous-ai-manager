# Tests pytest SHOPLINOUS - branche workflow-v5-fix1 uniquement.
# Aucun secret, aucune cle API : les tests utilisent des mocks httpx.
name: Tests pytest workflow

on:
  push:
    branches: [workflow-v5-fix1]
  pull_request:
    branches: [workflow-v5-fix1]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            workflow/requirements.txt
            workflow/requirements-dev.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt mistralai-workflows

      - name: Executer pytest (verbose)
        run: |
          set +e
          python -m pytest -v test_daily.py 2>&1 | tee pytest_output.txt
          exit_code=${PIPESTATUS[0]}
          echo "PYTEST_EXIT=${exit_code}" >> "$GITHUB_ENV"
          exit "$exit_code"

      - name: Publier les echecs en annotations publiques
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR)" pytest_output.txt | while IFS= read -r line; do
            echo "::error::${line}"
          done
          tail -n 25 pytest_output.txt | while IFS= read -r line; do
            echo "::error::${line}"
          done
