# Tests pytest + build Docker SHOPLINOUS.
# Aucun secret, aucune cle API : les tests utilisent des mocks httpx.
# La suite COMPLETE est decouverte automatiquement : tout nouveau
# fichier test_*.py est execute sans modification de ce fichier.
#
# Job pytest-image-validator : execute REELLEMENT les tests du dossier
# workflow-cloud/image_validator/tests/ (le job "pytest" ci-dessus ne
# couvre que le dossier workflow/). Une garde verifie que >= 20 tests
# sont bien executes.
name: Tests pytest workflow

on:
  workflow_dispatch:

  push:
    branches: [main, workflow-v5-fix1, workflow-v5-fix2, workflow-v5-fix3, workflow-v5-fix4, workflow-v5-fix5b, workflow-v5-fix6, workflow-v5-fix7, workflow-v5-fix8-ai-gateway, fix/dynamic-shipping-quantity, global-v6-platform, fix/payment-webhook-hardening-20261102, vibe/passation-v6, feat/worldwide-iso-internationalization, feat/http-get-image-validator]
  pull_request:
    branches: [main, workflow-v5-fix1, workflow-v5-fix2, workflow-v5-fix3, workflow-v5-fix4, workflow-v5-fix5b, workflow-v5-fix6, workflow-v5-fix7, workflow-v5-fix8-ai-gateway, fix/dynamic-shipping-quantity, global-v6-platform, fix/payment-webhook-hardening-20261102, vibe/passation-v6, feat/worldwide-iso-internationalization]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Valider la syntaxe YAML des workflows CI
        run: |
          pip install pyyaml
          python -c "import glob, sys, yaml; files = sorted(glob.glob('../.github/workflows/*.yml') + glob.glob('../.github/workflows/*.yaml')); sys.exit(1) if not files else None; [yaml.safe_load(open(f, encoding='utf-8')) for f in files]; print('YAML OK :', len(files), 'workflows valides')"

      - name: Installer pip a jour
        run: python -m pip install --upgrade pip

      - name: Installer les dependances (runtime requirements.txt)
        run: pip install -r requirements.txt

      - name: Installer les dependances tests (requirements-dev.txt)
        run: pip install -r requirements-dev.txt

      - name: Executer la suite pytest COMPLETE (decouverte automatique)
        run: |
          set +e
          python -m pytest -v 2>&1 | tee pytest_output.txt
          exit_code=${PIPESTATUS[0]}
          echo "PYTEST_EXIT=${exit_code}" >> "$GITHUB_ENV"
          exit "${exit_code}"

      - name: Publier les echecs en annotations publiques
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR)" pytest_output.txt | while IFS= read -r line; do
            echo "::error::${line}"
          done
          tail -n 25 pytest_output.txt | while IFS= read -r line; do
            echo "::error::${line}"
          done

  pytest-image-validator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow-cloud/image_validator
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer pip a jour
        run: python -m pip install --upgrade pip

      - name: Installer les dependances du validateur (httpx, pydantic)
        run: |
          pip install httpx pydantic
          pip install pytest

      - name: Executer les tests du validateur d'images (workflow-cloud/image_validator/tests/)
        env:
          SHOPLINOUS_TEST_MODE: "1"
        run: |
          set +e
          python -m pytest tests -v 2>&1 | tee pytest_cloud_output.txt
          exit_code=${PIPESTATUS[0]}
          total=$(grep -oE "[0-9]+ passed" pytest_cloud_output.txt | grep -oE "[0-9]+" | tail -n 1)
          echo "TESTS_IMAGE_VALIDATOR=${total}" >> "$GITHUB_ENV"
          echo "Tests image_validator executes : ${total}"
          if [ -z "${total}" ] || [ "${total}" -lt 20 ]; then
            echo "::error::Tests du validateur non executes ou insuffisants (${total:-0} < 20) : la CI ne couvre pas workflow-cloud/image_validator/tests/"
            exit 1
          fi
          exit "${exit_code}"

      - name: Publier les echecs en annotations publiques
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR)" pytest_cloud_output.txt | while IFS= read -r line; do
            echo "::error::${line}"
          done
          tail -n 25 pytest_cloud_output.txt | while IFS= read -r line; do
            echo "::error::${line}"
          done

  build-docker:
    runs-on: ubuntu-latest
    needs: [pytest, pytest-image-validator]
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Construire l'image Docker principale
        run: docker build -f workflow/Dockerfile -t shoplinous-worker:test .

      - name: Construire explicitement le Dockerfile du validateur cloud (SDK reel)
        run: docker build -f workflow-cloud/image_validator/Dockerfile -t shoplinous-image-validator:test workflow-cloud/image_validator

      - name: Verifier SDK Mistral et decouverte du workflow dans le conteneur dedie
        run: |
          docker run --rm --entrypoint python shoplinous-image-validator:test -c "import mistralai.workflows as wf; from src.workflows import image_validator as iv; discovered=wf.discover_workflows(); assert discovered; print('MISTRAL_WORKFLOWS_SDK_OK', type(iv.workflows).__name__, len(discovered))"

      - name: Demarrer le conteneur principal et verifier les imports du worker
        run: docker run --rm --entrypoint python shoplinous-worker:test -c "import mistralai.workflows; import daily; print('WORKER_IMPORTS_OK')"
