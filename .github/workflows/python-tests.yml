# Tests pytest SHOPLINOUS - branches fix1 a fix7 (audit v5.4, prix v5.5,
# collecteur v5.5, correctifs v5.6 : fret 15 jours, variantes blanche/noire,
# expiration TTL, CI fix7).
# Aucun secret, aucune cle API : les tests utilisent des mocks httpx.
name: Tests pytest workflow

on:
  push:
    branches: [workflow-v5-fix1, workflow-v5-fix2, workflow-v5-fix3, workflow-v5-fix4, workflow-v5-fix5b, workflow-v5-fix6, workflow-v5-fix7]
  pull_request:
    branches: [workflow-v5-fix1, workflow-v5-fix2, workflow-v5-fix3, workflow-v5-fix4, workflow-v5-fix5b, workflow-v5-fix6, workflow-v5-fix7]

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer pip a jour
        run: python -m pip install --upgrade pip

      - name: Installer les dependances (runtime requirements.txt)
        run: pip install -r requirements.txt

      - name: Installer les dependances tests (requirements-dev.txt)
        run: pip install -r requirements-dev.txt

      - name: Installer mistralai-workflows (namespace mistralai)
        run: pip install mistralai-workflows

      - name: Diagnostic complet (ecrit dans diag_ci.txt)
        run: |
          { echo '=== sys.path ==='; python -c "import sys; print(sys.path)"
            echo '=== ls ==='; ls -la
            echo '=== import direct ai_manager ==='; python -c "import ai_manager; print('OK', ai_manager.__file__)"
            echo '=== collect-only test_ai_manager (tb=long) ==='; python -m pytest --collect-only --tb=long test_ai_manager.py
            echo '=== collect-only verbeux ==='; python -m pytest --collect-only test_ai_manager.py -q ; } > diag_ci.txt 2>&1 || true
          head -c 4000 diag_ci.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Publier diag_ci.txt sur la branche [skip ci]
        if: always()
        run: |
          git config user.name "ci-diagnostic"
          git config user.email "ci-diagnostic@users.noreply.github.com"
          git add diag_ci.txt || true
          git commit -m "diag CI collection test_ai_manager [skip ci]" || true
          git push origin HEAD:workflow-v5-fix7 || true

      - name: Executer pytest (verbose)
        run: |
          set +e
          python -m pytest -v test_daily.py test_audit_v54.py test_pricing_v55.py test_freight_collector_v55.py test_freight_collector_v56.py test_ai_manager.py 2>&1 | tee pytest_output.txt
          exit_code=${PIPESTATUS[0]}
          echo "PYTEST_EXIT=${exit_code}" >> "$GITHUB_ENV"
          exit "${exit_code}"

      - name: Publier les echecs en annotations publiques
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR)" pytest_output.txt | while IFS= read -r line; do
            echo "::error::${line}"
          done
          tail -n 25 pytest_output.txt | while IFS= read -r line; do
            echo "::error::${line}"
          done
