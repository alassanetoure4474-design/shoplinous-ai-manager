# Tests pytest + build Docker SHOPLINOUS.
# Aucun secret, aucune cle API : les tests utilisent des mocks httpx.
# La suite COMPLETE est decouverte automatiquement : tout nouveau
# fichier test_*.py est execute sans modification de ce fichier.
name: Tests pytest workflow

on:
  push:
    branches: [main, workflow-v5-fix1, workflow-v5-fix2, workflow-v5-fix3, workflow-v5-fix4, workflow-v5-fix5b, workflow-v5-fix6, workflow-v5-fix7, workflow-v5-fix8-ai-gateway, fix/dynamic-shipping-quantity, global-v6-platform]
  pull_request:
    branches: [main, workflow-v5-fix1, workflow-v5-fix2, workflow-v5-fix3, workflow-v5-fix4, workflow-v5-fix5b, workflow-v5-fix6, workflow-v5-fix7, workflow-v5-fix8-ai-gateway, fix/dynamic-shipping-quantity, global-v6-platform]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer pip a jour
        run: python -m pip install --upgrade pip

      - name: Installer les dependances (runtime requirements.txt)
        run: pip install -r requirements.txt

      - name: Installer les dependances tests (requirements-dev.txt)
        run: pip install -r requirements-dev.txt

      - name: Diagnostic imports modules v6
        run: |
          cat > diag.py <<'EOF'
mods = ["shoplinous_global", "shoplinous_global.market_manager",
        "shoplinous_global.country_manager",
        "shoplinous_global.currency_manager",
        "shoplinous_global.exchange_rate_manager",
        "shoplinous_global.pricing_manager",
        "shoplinous_global.payment_manager",
        "shoplinous_global.payment_providers",
        "shoplinous_global.supplier_manager",
        "shoplinous_global.supplier_adapters",
        "shoplinous_global.product_catalog",
        "shoplinous_global.inventory",
        "shoplinous_global.shipping_manager",
        "shoplinous_global.order_manager",
        "shoplinous_global.tracking_manager",
        "shoplinous_global.ai_decision_engine",
        "shoplinous_global.notification_manager",
        "shoplinous_global.security_audit",
        "shoplinous_global.monitoring",
        "test_global_core", "test_global_payment_suppliers",
        "test_global_v6"]
for m in mods:
    try:
        __import__(m)
        print("DIAG OK " + m)
    except Exception as e:
        print("DIAG KO " + m + " :: " + repr(e)[:300])
EOF
          python diag.py 2>&1 | while IFS= read -r line; do
            case "$line" in
              "DIAG KO"*) echo "::error::${line}" ;;
            esac
          done
      - name: Executer la suite pytest COMPLETE (decouverte automatique)
        run: |
          set +e
          python -m pytest -v 2>&1 | tee pytest_output.txt
          exit_code=${PIPESTATUS[0]}
          echo "PYTEST_EXIT=${exit_code}" >> "$GITHUB_ENV"
          exit "${exit_code}"

      - name: Publier les echecs en annotations publiques
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR)" pytest_output.txt | while IFS= read -r line; do
            echo "::error::${line}"
          done
          tail -n 25 pytest_output.txt | while IFS= read -r line; do
            echo "::error::${line}"
          done

  build-docker:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Construire l'image Docker
        run: docker build -f workflow/Dockerfile -t shoplinous-worker:test .

      - name: Demarrer le conteneur et verifier les imports du worker
        run: docker run --rm --entrypoint python shoplinous-worker:test -c "import mistralai.workflows; import daily; print('WORKER_IMPORTS_OK')"
