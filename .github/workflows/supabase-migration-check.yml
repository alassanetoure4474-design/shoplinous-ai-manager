name: Check Supabase SQL migration

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/supabase-migration-check.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/supabase-migration-check.yml"

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shoplinous_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shoplinous_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shoplinous_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create Supabase-compatible roles
        run: |
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN;
            END IF;
          END
          $$;
          GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
          SQL

      - name: Apply persistent payments migration to disposable PostgreSQL
        run: |
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20261102000000_create_persistent_payments.sql

      - name: Verify RLS, grants, payment RPCs and webhook idempotency
        run: |
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1 \
            --file supabase/tests/20261102_persistent_payments_migration.sql
