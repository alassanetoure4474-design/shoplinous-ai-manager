# Achèvement du déploiement SHOPLINOUS (autorisation proprietaire 04/11/2026).
# Declenche UNE SEULE fois : a la poussee du fichier marqueur DEPLOY_NOW.
# Ne s'execute jamais pour les autres pousses sur main (filtre paths).
name: Finish SHOPLINOUS deploy (one-shot)

on:
  push:
    branches: [main]
    paths: ["DEPLOY_NOW", ".github/workflows/finish-shoplinous-deploy.yml"]

permissions:
  contents: read

jobs:
  finish:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GENIUSPAY_API_KEY: ${{ secrets.GENIUSPAY_API_KEY }}
      GENIUSPAY_API_SECRET: ${{ secrets.GENIUSPAY_API_SECRET }}
      GENIUSPAY_WEBHOOK_SECRET: ${{ secrets.GENIUSPAY_WEBHOOK_SECRET }}
      GENIUSPAY_ENVIRONMENT: sandbox
      GENIUSPAY_ALLOW_LIVE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Installer Python et httpx
        run: pip install httpx

      - name: Verifier les secrets requis (sans les afficher)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN absent dans les secrets GitHub"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::SUPABASE_DB_PASSWORD absent dans les secrets GitHub"; exit 1; }
          if [[ "$SUPABASE_PROJECT_ID" != "giarkrdmwfrlagkqnkvi" ]]; then
            echo "::error::SUPABASE_PROJECT_ID ne correspond pas au projet SHOPLINOUS verifie."
            exit 1
          fi
          test -n "$GENIUSPAY_API_KEY" || { echo "::error::GENIUSPAY_API_KEY absent"; exit 1; }
          test -n "$GENIUSPAY_API_SECRET" || { echo "::error::GENIUSPAY_API_SECRET absent"; exit 1; }
          echo "Secrets Supabase et GeniusPay presents ; environnement sandbox force."

      - name: Preparer l'URL du pooler IPv4 (identifiants masques)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import quote

          project_ref = os.environ["SUPABASE_PROJECT_ID"]
          password = os.environ["SUPABASE_DB_PASSWORD"]
          if not password:
              raise SystemExit("SUPABASE_DB_PASSWORD absent")
          if any(ord(char) < 32 or ord(char) == 127 for char in password):
              raise SystemExit("SUPABASE_DB_PASSWORD contient un caractere de controle interdit")

          username = f"postgres.{project_ref}"
          encoded_password = quote(password, safe="")
          pooler_url = (
              f"postgresql://{username}:{encoded_password}"
              "@aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require"
          )

          def escape_workflow_command(value: str) -> str:
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          print(f"::add-mask::{escape_workflow_command(encoded_password)}")
          print(f"::add-mask::{escape_workflow_command(pooler_url)}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"SUPABASE_DB_URL={pooler_url}\n")
          print("Pooler de session IPv4 prepare pour le project-ref verifie.")
          PY

      - name: Apercu des migrations en attente
        run: supabase db push --dry-run --remote="$SUPABASE_DB_URL"

      - name: Appliquer les migrations (schema additif, autorisation proprietaire)
        run: supabase db push --yes --remote="$SUPABASE_DB_URL"

      - name: Creer (ou reutiliser) le webhook GeniusPay Sandbox
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, "workflow")
          from shoplinous_global.geniuspay import GeniusPayClient

          existing = (os.environ.get("GENIUSPAY_WEBHOOK_SECRET") or "").strip()
          url = "https://giarkrdmwfrlagkqnkvi.supabase.co/functions/v1/geniuspay-webhook"
          webhook_id = ""
          if existing:
              print("Secret webhook GeniusPay deja present dans GitHub : reutilise, aucun webhook nouveau cree.")
              secret = existing
          else:
              client = GeniusPayClient.from_env()
              data = client.creer_webhook(url=url, nom="SHOPLINOUS webhook sandbox")
              secret = str(data["secret"])
              webhook_id = str(data.get("id") or data.get("webhook_id") or "")
              print("Webhook GeniusPay cree pour " + url)
              print("::add-mask::" + secret)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("GP_WEBHOOK_SECRET=" + secret + "\n")
              output.write("GP_WEBHOOK_ID=" + (webhook_id or "none") + "\n")
          print("Secret webhook disponible pour l'injection Supabase (jamais affiche).")

      - name: Injecter le secret GeniusPay dans la Edge Function
        run: supabase secrets set "GENIUSPAY_WEBHOOK_SECRET=$GP_WEBHOOK_SECRET" --yes --remote="$SUPABASE_PROJECT_ID"

      - name: Deployer la fonction webhook signee (JWT desactive pour GeniusPay)
        run: supabase functions deploy geniuspay-webhook --no-verify-jwt --yes --remote="$SUPABASE_PROJECT_ID"

      - name: Tester le webhook (evenement webhook.test signe)
        if: env.GP_WEBHOOK_ID != 'none'
        shell: python
        run: |
          import os, sys, json
          import httpx
          webhook_id = os.environ["GP_WEBHOOK_ID"]
          if not webhook_id:
              print("Pas de webhook a tester (secret existant reutilise).")
              raise SystemExit(0)
          sys.path.insert(0, "workflow")
          from shoplinous_global.geniuspay import GeniusPayClient
          client = GeniusPayClient.from_env()
          with httpx.Client(timeout=20.0) as http:
              resp = http.post(
                  client.base_url + "/webhooks/" + webhook_id + "/test",
                  headers=client._headers(),
              )
          print("HTTP " + str(resp.status_code) + " pour POST /webhooks/" + webhook_id + "/test")
          body = {}
          try:
              body = resp.json()
          except ValueError:
              pass
          if resp.status_code < 200 or resp.status_code >= 300:
              print(json.dumps({k: body.get(k) for k in ("success", "message", "error") if k in body}))
              raise SystemExit(1)
          print("Test webhook declenche : GeniusPay enverra un evenement signe a l'Edge Function.")

      - name: Verifier que l'Edge Function repond
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST               "https://giarkrdmwfrlagkqnkvi.supabase.co/functions/v1/geniuspay-webhook"               -H "Content-Type: application/json" -d '{}' || true)
            echo "Tentative $i : HTTP $code"
            if [ "$code" != "000" ] && [ "$code" != "502" ] && [ "$code" != "503" ]; then
              echo "EDGE_FUNCTION_UP (HTTP $code)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Edge Function injoignable apres 5 tentatives"
          exit 1
