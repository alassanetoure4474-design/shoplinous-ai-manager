name: Apply Supabase database migrations

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: "Confirmer l'application après avoir vérifié un dry-run précédent"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify required Supabase secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN absent"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "::error::SUPABASE_PROJECT_ID absent"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::SUPABASE_DB_PASSWORD absent"; exit 1; }
          if [[ ! "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::SUPABASE_PROJECT_ID doit être le project-ref Supabase de 20 caractères."
            exit 1
          fi

      - name: Preview pending migrations on the explicitly selected project
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD" --remote="$SUPABASE_PROJECT_ID"

      - name: Apply migrations only after explicit second confirmation
        if: ${{ inputs.confirm_apply == true }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes --remote="$SUPABASE_PROJECT_ID"

      - name: Dry-run only; no database changes were made
        if: ${{ inputs.confirm_apply != true }}
        run: echo "Aperçu terminé. Aucune migration n'a été appliquée. Vérifiez le journal, puis relancez le workflow avec confirm_apply=true pour appliquer."
