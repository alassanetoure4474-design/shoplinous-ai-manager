name: Check Supabase Edge Functions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-geniuspay-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check GeniusPay webhook
        run: deno check --no-lock supabase/functions/geniuspay-webhook/index.ts

      - name: Run GeniusPay webhook security tests
        run: deno test --no-lock supabase/functions/geniuspay-webhook/handler_test.ts
