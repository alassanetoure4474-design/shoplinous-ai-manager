name: Deploy Shoplinous Checkout

on:
  push:
    branches: [main]
    paths:
      - CHECKOUT_DEPLOY_NOW
      - .github/workflows/deploy-shoplinous-checkout.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer la CLI Supabase
        run: |
          set -e
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.121.0/supabase_linux_amd64.tar.gz -o /tmp/sb.tar.gz
          tar -xzf /tmp/sb.tar.gz -C /usr/local/bin supabase
          supabase --version

      - name: Pousser les secrets de fonction
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          FW_KEY: ${{ secrets.FREEWEBSTORE_API_KEY }}
        run: |
          set +e
          args=""
          args="$args GENIUSPAY_API_KEY=${{ secrets.GENIUSPAY_API_KEY }}"
          args="$args GENIUSPAY_API_SECRET=${{ secrets.GENIUSPAY_API_SECRET }}"
          args="$args GENIUSPAY_ENVIRONMENT=sandbox"
          args="$args GENIUSPAY_API_BASE=https://geniuspay.ci/api/v1/merchant"
          args="$args FREEWEBSTORE_API_BASE=https://api.freewebstore.com"
          args="$args GENIUSPAY_TEST_MODE=true"
          if [ -n "$FW_KEY" ]; then
            args="$args FREEWEBSTORE_API_KEY=$FW_KEY"
            echo "::notice::FREEWEBSTORE_API_KEY pousse vers Supabase"
          else
            echo "::warning::Secret FREEWEBSTORE_API_KEY absent : le mode commandes Freewebstore reelles renverra 503 jusqu'a son ajout."
          fi
          echo "Nombre de secrets a pousser : $(echo $args | wc -w)"
          ver=$(supabase --version 2>&1)
          echo "::notice::CLI $ver"
          out1=$(supabase secrets set $args --project-ref "$PROJECT_ID" 2>&1)
          c1=$?
          echo "$out1"
          if [ $c1 -eq 0 ]; then
            echo "::notice::secrets pousses (project-ref)"
          else
            out2=$(supabase secrets set $args --remote="$PROJECT_ID" 2>&1)
            c2=$?
            echo "$out2"
            if [ $c2 -eq 0 ]; then
              echo "::notice::secrets pousses (--remote)"
            else
              out3=$(supabase secrets set $args 2>&1)
              c3=$?
              echo "$out3"
              if [ $c3 -eq 0 ]; then
                echo "::notice::secrets pousses (env SUPABASE_PROJECT_ID)"
              else
                echo "::error::secrets set echoue avec les 3 syntaxes. v1: ${out1:0:200} | v2: ${out2:0:200} | v3: ${out3:0:200}"
                exit 1
              fi
            fi
          fi

      - name: Appliquer les migrations via l'API Management (HTTPS)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set +e
          API="https://api.supabase.com/v1/projects/$PROJECT_ID/database/query"
          AUTH="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          CT="Content-Type: application/json"
          req() {
            payload=$(jq -n --arg q "$1" '{query:$q}')
            curl -s -o /tmp/q.json -w "%{http_code}" -X POST "$API" -H "$AUTH" -H "$CT" -d "$payload"
          }
          http=$(req "select version from supabase_migrations.schema_migrations")
          applied=$(tr ',' '\n' < /tmp/q.json | grep -oE '[0-9]{14}' | sort -u)
          echo "Migrations deja appliquees: $(echo $applied | tr '\n' ' ')"
          for f in supabase/migrations/*.sql; do
            version=$(basename "$f" .sql)
            if echo "$applied" | grep -q "$version"; then
              echo "Deja appliquee: $version"
              continue
            fi
            echo "Application de $version ..."
            sql=$(cat "$f")
            http=$(req "$sql")
            if [ "$http" != "200" ]; then
              echo "::error::Migration $version code=$http: $(head -c 400 /tmp/q.json)"
              exit 1
            fi
            if grep -q '"error"' /tmp/q.json 2>/dev/null; then
              echo "::error::Migration $version erreur SQL: $(head -c 400 /tmp/q.json)"
              exit 1
            fi
            echo "Reponse: $(head -c 200 /tmp/q.json)"
            http=$(req "insert into supabase_migrations.schema_migrations (version, statements) values ('$version', 1) on conflict (version) do nothing")
            if [ "$http" != "200" ]; then
              echo "::error::Historique $version code=$http"
              exit 1
            fi
            echo "::notice::Migration $version appliquee via API Management"
          done

      - name: Verifier les RPC du checkout en base
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set +e
          API="https://api.supabase.com/v1/projects/$PROJECT_ID/database/query"
          payload=$(jq -n --arg q "select proname from pg_proc where proname in ('shoplinous_reserve_payment','shoplinous_finalize_checkout','shoplinous_order_status','shoplinous_process_geniuspay_webhook')" '{query:$q}')
          http=$(curl -s -o /tmp/rpc.json -w "%{http_code}" -X POST "$API" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload")
          cat /tmp/rpc.json
          echo ""
          count=$(grep -o "shoplinous_[a-z_]*" /tmp/rpc.json | sort -u | wc -l)
          echo "RPC trouves : $count"
          if [ "$http" != "200" ] || [ "$count" -lt 4 ]; then
            echo "::error::RPC checkout manquants (code=$http, count=$count)"
            exit 1
          fi
          echo "::notice::Les 4 RPC du checkout existent en base"

      - name: Deployer la fonction geniuspay-order
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set +e
          output=$(supabase functions deploy geniuspay-order --no-verify-jwt --project-ref "$PROJECT_ID" 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ]; then
            output=$(supabase functions deploy geniuspay-order --no-verify-jwt 2>&1)
            code=$?
            echo "$output"
          fi
          if [ $code -ne 0 ]; then
            echo "::error::functions deploy code=$code"
            exit 1
          fi
          echo "::notice::geniuspay-order deployee"

      - name: Sonder la fonction deployee
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          url="https://$PROJECT_ID.supabase.co/functions/v1/geniuspay-order"
          code=$(curl -s -o /tmp/probe.json -w "%{http_code}" "$url?action=status")
          echo "HTTP $code"
          cat /tmp/probe.json
          echo ""
          if [ "$code" = "000" ]; then
            echo "::error::La fonction geniuspay-order ne repond pas"
            exit 1
          fi
          echo "::notice::geniuspay-order joignable (HTTP $code)"
