name: Deploy Shoplinous Checkout

on:
  push:
    branches: [main]
    paths:
      - CHECKOUT_DEPLOY_NOW
      - .github/workflows/deploy-shoplinous-checkout.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer la CLI Supabase
        run: |
          set -e
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.121.0/supabase_linux_amd64.tar.gz -o /tmp/sb.tar.gz
          tar -xzf /tmp/sb.tar.gz -C /usr/local/bin supabase
          supabase --version

      - name: Pousser les secrets de fonction
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          FW_KEY: ${{ secrets.FREEWEBSTORE_API_KEY }}
        run: |
          set +e
          MIGRATE_TOKEN=$(openssl rand -hex 24)
          echo "::add-mask::$MIGRATE_TOKEN"
          echo "MIGRATE_TOKEN=$MIGRATE_TOKEN" >> "$GITHUB_ENV"
          args=""
          args="$args GENIUSPAY_API_KEY=${{ secrets.GENIUSPAY_API_KEY }}"
          args="$args GENIUSPAY_API_SECRET=${{ secrets.GENIUSPAY_API_SECRET }}"
          args="$args GENIUSPAY_ENVIRONMENT=sandbox"
          args="$args GENIUSPAY_API_BASE=https://geniuspay.ci/api/v1/merchant"
          args="$args FREEWEBSTORE_API_BASE=https://api.freewebstore.com"
          args="$args GENIUSPAY_TEST_MODE=true"
          args="$args DB_MIGRATE_TOKEN=$MIGRATE_TOKEN"
          if [ -n "$FW_KEY" ]; then
            args="$args FREEWEBSTORE_API_KEY=$FW_KEY"
            echo "::notice::FREEWEBSTORE_API_KEY pousse vers Supabase"
          else
            echo "::warning::Secret FREEWEBSTORE_API_KEY absent : le mode commandes Freewebstore reelles renverra 503 jusqu'a son ajout."
          fi
          out1=$(supabase secrets set $args --project-ref "$PROJECT_ID" 2>&1)
          c1=$?
          echo "$out1"
          if [ $c1 -ne 0 ]; then
            echo "::error::secrets set echoue"
            exit 1
          fi
          echo "::notice::secrets pousses (project-ref)"

      - name: Deployer la fonction temporaire db-migrate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set +e
          output=$(supabase functions deploy db-migrate --no-verify-jwt --project-ref "$PROJECT_ID" 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ]; then
            echo "::error::deploiement db-migrate code=$code"
            exit 1
          fi
          echo "::notice::db-migrate deployee"

      - name: Appliquer les migrations via db-migrate
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set +e
          FUNC="https://$PROJECT_ID.supabase.co/functions/v1/db-migrate"
          run_sql() {
            payload=$(jq -n --arg t "$MIGRATE_TOKEN" --arg q "$1" '{token:$t, sql:$q}')
            curl -s -o /tmp/q.json -w "%{http_code}" -X POST "$FUNC" -H "content-type: application/json" -d "$payload"
          }
          http=$(run_sql "select version from supabase_migrations.schema_migrations")
          echo "Historique : HTTP $http"
          echo "Corps : $(head -c 300 /tmp/q.json)"
          applied=""
          if grep -q '"ok": *true' /tmp/q.json; then
            applied=$(tr ',' '\n' < /tmp/q.json | grep -oE '[0-9]{14}' | sort -u)
            echo "Migrations deja appliquees : $applied"
          else
            echo "::notice::Historique absent ou illisible, toutes les migrations seront tentees"
          fi
          fail=0
          for f in supabase/migrations/*.sql; do
            version=$(basename "$f" .sql)
            if echo "$applied" | grep -q "$version"; then
              echo "Deja appliquee : $version"
              continue
            fi
            echo "Application de $version ..."
            sql=$(cat "$f")
            http=$(run_sql "$sql")
            echo "Migration $version : HTTP $http"
            echo "Corps : $(head -c 400 /tmp/q.json)"
            if [ "$http" != "200" ] || grep -q '"ok": *false' /tmp/q.json; then
              if grep -q 'already exists' /tmp/q.json; then
                echo "::notice::Migration $version deja integree en base (already exists)"
              else
                echo "::error::Migration $version echouee (HTTP $http) : $(head -c 350 /tmp/q.json)"
                fail=1
                break
              fi
            fi
            http=$(run_sql "insert into supabase_migrations.schema_migrations (version, statements) values ('$version', 1) on conflict (version) do nothing")
            if [ "$http" != "200" ] || grep -q '"ok": *false' /tmp/q.json; then
              echo "::notice::Historique indisponible pour $version (non bloquant)"
            fi
            echo "::notice::Migration $version appliquee via db-migrate"
          done
          exit $fail

      - name: Verifier les RPC du checkout en base
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -e
          FUNC="https://$PROJECT_ID.supabase.co/functions/v1/db-migrate"
          payload=$(jq -n --arg t "$MIGRATE_TOKEN" --arg q "select proname from pg_proc where proname in ('shoplinous_reserve_payment','shoplinous_finalize_checkout','shoplinous_order_status','shoplinous_process_geniuspay_webhook')" '{token:$t, sql:$q}')
          http=$(curl -s -o /tmp/rpc.json -w "%{http_code}" -X POST "$FUNC" -H "content-type: application/json" -d "$payload")
          cat /tmp/rpc.json
          echo ""
          count=$(grep -o 'shoplinous_[a-z_]*' /tmp/rpc.json | sort -u | wc -l)
          echo "RPC trouves : $count"
          if [ "$http" != "200" ] || [ "$count" -lt 4 ]; then
            echo "::error::RPC checkout manquants (code=$http, count=$count)"
            exit 1
          fi
          echo "::notice::Les 4 RPC du checkout existent en base"

      - name: Deployer la fonction geniuspay-order
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set +e
          output=$(supabase functions deploy geniuspay-order --no-verify-jwt --project-ref "$PROJECT_ID" 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ]; then
            echo "::error::functions deploy code=$code"
            exit 1
          fi
          echo "::notice::geniuspay-order deployee"

      - name: Sonder la fonction deployee
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          url="https://$PROJECT_ID.supabase.co/functions/v1/geniuspay-order"
          code=$(curl -s -o /tmp/probe.json -w "%{http_code}" "$url?action=status")
          echo "HTTP $code"
          cat /tmp/probe.json
          echo ""
          if [ "$code" = "000" ]; then
            echo "::error::La fonction geniuspay-order ne repond pas"
            exit 1
          fi
          echo "::notice::geniuspay-order joignable (HTTP $code)"

      - name: Desactiver le token db-migrate
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase secrets set "DB_MIGRATE_TOKEN=desactive" --project-ref "$PROJECT_ID" >/dev/null 2>&1 \
            && echo "::notice::Token db-migrate desactive" \
            || echo "::warning::Token db-migrate non desactive (a faire manuellement)"
