name: Deploy Shoplinous Checkout

on:
  push:
    branches: [main]
    paths:
      - CHECKOUT_DEPLOY_NOW
      - .github/workflows/deploy-shoplinous-checkout.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifier les secrets requis
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SB_PROJECT: ${{ secrets.SUPABASE_PROJECT_ID }}
          GP_KEY: ${{ secrets.GENIUSPAY_API_KEY }}
          GP_SECRET: ${{ secrets.GENIUSPAY_API_SECRET }}
        run: |
          missing=0
          for pair in "SUPABASE_ACCESS_TOKEN:$SB_TOKEN" "SUPABASE_PROJECT_ID:$SB_PROJECT" "GENIUSPAY_API_KEY:$GP_KEY" "GENIUSPAY_API_SECRET:$GP_SECRET"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "::error::Secret manquant: $name"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Pousser les secrets de fonction
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          FW_KEY: ${{ secrets.FREEWEBSTORE_API_KEY }}
        run: |
          args=""
          args="$args GENIUSPAY_API_KEY=${{ secrets.GENIUSPAY_API_KEY }}"
          args="$args GENIUSPAY_API_SECRET=${{ secrets.GENIUSPAY_API_SECRET }}"
          args="$args GENIUSPAY_ENVIRONMENT=sandbox"
          args="$args GENIUSPAY_API_BASE=https://geniuspay.ci/api/v1/merchant"
          args="$args FREEWEBSTORE_API_BASE=https://api.freewebstore.com"
          args="$args GENIUSPAY_TEST_MODE=true"
          if [ -n "$FW_KEY" ]; then
            args="$args FREEWEBSTORE_API_KEY=$FW_KEY"
            echo "::notice::FREEWEBSTORE_API_KEY pousse vers Supabase"
          else
            echo "::warning::Secret FREEWEBSTORE_API_KEY absent : le mode commandes Freewebstore reelles renverra 503 jusqu'a son ajout."
          fi
          # shellcheck disable=SC2086
          supabase secrets set $args --project-ref "$PROJECT_ID"

      - name: Appliquer les migrations (db push)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase db push --project-ref "$PROJECT_ID"

      - name: Deployer la fonction geniuspay-order
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy geniuspay-order --no-verify-jwt --project-ref "$PROJECT_ID"

      - name: Sonder la fonction deployee
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          url="https://$PROJECT_ID.supabase.co/functions/v1/geniuspay-order"
          code=$(curl -s -o /tmp/probe.json -w "%{http_code}" "$url?action=status")
          echo "HTTP $code"
          cat /tmp/probe.json
          echo ""
          if [ "$code" = "000" ]; then
            echo "::error::La fonction geniuspay-order ne repond pas"
            exit 1
          fi
          echo "::notice::geniuspay-order deployee et joignable (HTTP $code)"
