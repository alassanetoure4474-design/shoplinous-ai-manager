name: Deploy GeniusPay webhook (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Confirmer le déploiement du webhook GeniusPay sur Supabase"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: \${{ inputs.confirm_deploy == true }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: \${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: \${{ secrets.SUPABASE_PROJECT_ID }}
      GENIUSPAY_WEBHOOK_SECRET: \${{ secrets.GENIUSPAY_WEBHOOK_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN absent"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "::error::SUPABASE_PROJECT_ID absent"; exit 1; }
          test -n "$GENIUSPAY_WEBHOOK_SECRET" || { echo "::error::GENIUSPAY_WEBHOOK_SECRET absent"; exit 1; }

      - name: Set GeniusPay webhook secret in Supabase
        run: supabase secrets set "GENIUSPAY_WEBHOOK_SECRET=$GENIUSPAY_WEBHOOK_SECRET" --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy the signed webhook receiver
        run: supabase functions deploy geniuspay-webhook --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
