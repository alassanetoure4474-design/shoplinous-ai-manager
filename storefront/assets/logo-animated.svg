<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
<title id="title">SHOPLINOUS AFRICA</title><desc id="desc">Emblème géométrique animé évoquant le soleil, le mouvement et la découverte.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5a85f"/><stop offset="1" stop-color="#f0d9a4"/></linearGradient></defs>
<circle cx="48" cy="48" r="43" fill="#173d31"/>
<circle cx="48" cy="48" r="31" fill="none" stroke="url(#g)" stroke-width="1.6" stroke-dasharray="5 5" class="orbit"/>
<path d="M48 16 55 37 77 30 61 48 77 66 55 59 48 80 41 59 19 66 35 48 19 30 41 37Z" fill="url(#g)" class="sun"/>
<circle cx="48" cy="48" r="9" fill="#173d31"/><path d="M48 39v18M39 48h18" stroke="#f4ead3" stroke-width="2" stroke-linecap="round"/>
<style>
.orbit{transform-origin:48px 48px;animation:orbit 24s linear infinite}
.sun{transform-origin:48px 48px;animation:breathe 4s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes breathe{0%,100%{transform:scale(.94)}50%{transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){.orbit,.sun{animation:none}}
</style></svg>